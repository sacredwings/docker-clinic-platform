services:
  postgres:
    image: postgres:latest
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:latest
    env_file: .env
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  voenset:
    build:
      context: ./projects/voenset
    env_file:
      - .env
      - ./projects/voenset/.env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3000"

  voenset-process:
    build:
      context: ./projects/voenset-process
    env_file:
      - .env
      - ./projects/voenset-process/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"